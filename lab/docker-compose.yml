# The throwaway lab. Two containers against one kernel.
#
# sensor: privileged, pid=host, owns the kernel audit subsystem, writes audit.log
#         to ../data/audit on the host so the orchestrator reads it directly.
# target: where atomics and benign profiles execute. Privileged with SYS_PTRACE
#         so process-injection and module atomics can run. The normalizer scopes
#         lab activity by process tree, so the target being privileged does not
#         pollute the measurement.
services:
  sensor:
    build: ./sensor
    container_name: lab-sensor
    privileged: true
    pid: host
    volumes:
      - ../data/audit:/var/log/audit
      - ./audit.rules:/etc/audit/lab.rules:ro
    restart: "no"

  target:
    build: ./target
    container_name: lab-target
    privileged: true
    cap_add:
      - SYS_PTRACE
      - SYS_MODULE
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    # Keep the target dependent on the sensor so the sensor is recording before
    # any activity runs.
    depends_on:
      - sensor
    restart: "no"
