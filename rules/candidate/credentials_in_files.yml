# field hypothesis: Grepping the tree for passwords or secrets.
title: Credential search across files
id: 9fde29f3-a94e-5f90-9ac5-9e1ac4731ef6
status: experimental
description: Credential search across files
author: rule-synth
date: 2026/08/12
tags:
- attack.credential_access
- attack.t1552.001
logsource:
  product: linux
  category: process_creation
detection:
  sel:
    exe|endswith: /grep
    cmdline|contains:
    - password
    - secret
    - id_rsa
    - 'BEGIN '
  condition: sel
level: medium
